<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Dynamic Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>Secure Dynamic Task Manager</h1>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Enter a task" aria-label="New task">
      <button id="addTaskBtn" type="button">Add Task</button>
      <button id="loadSamplesBtn" type="button" class="secondary">Load Sample Tasks</button>
    </div>
    <p id="taskMessage" class="message" role="alert"></p>

    <ul id="taskList"></ul>

    <section class="summary" aria-label="Task summary">
      <p>Total Tasks: <strong id="totalCount">0</strong></p>
      <p>Pending: <strong id="pendingCount">0</strong></p>
      <p>Completed: <strong id="completedCount">0</strong></p>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
